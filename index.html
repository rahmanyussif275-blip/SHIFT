<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e2640">
  <title>SHIFT.GH | Move Different</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<header class="site-header">
  <a class="logo" href="#home">SHIFT<span>.</span>GH</a>

  <nav class="desktop-nav" id="mainNav">
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#tops">Tops</a>
    <a href="#bottoms">Bottoms</a>
    <a href="#about">About</a>
  </nav>

  <div class="header-actions">
    <button id="searchToggle">Search</button>
    <button id="cartToggle">Bag <span id="cartCount">0</span></button>
    <button id="menuToggle">☰</button>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="hero-content">
      <p class="eyebrow">THE NEW STREETWEAR STANDARD</p>
      <h1>DON'T FOLLOW.<br><span>SHIFT.</span></h1>
      <p class="hero-description">
        Streetwear for those who move differently.
        Find your fit. Own your style.
      </p>
      <a class="primary-button" href="#shop">EXPLORE COLLECTION</a>
    </div>
  </section>

  <section id="shop">
    <h2>Find your uniform.</h2>
  </section>

  <section id="tops">
    <h2>TOPS.</h2>
    <div class="product-grid" id="topsGrid"></div>
  </section>

  <section id="bottoms">
    <h2>BOTTOMS.</h2>
    <div class="product-grid" id="bottomsGrid"></div>
  </section>

  <section id="about">
    <h2>SHIFT IS A MINDSET.</h2>
  </section>
</main>

</body>
</html>
